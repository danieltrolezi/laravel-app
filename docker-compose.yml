services:
  app:
    container_name: app.laravel-app
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV}
    env_file:
      - .env
    ports:
      - '80:80'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/laravel-app
    working_dir: /var/www/laravel-app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bridge
  
  mysql:
    container_name: mysql.laravel-app
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - bridge

networks:
  bridge:

volumes:
  mysql_data: