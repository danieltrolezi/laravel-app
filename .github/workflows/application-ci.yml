name: Application CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  ci-checks: 
    uses: ./.github/workflows/ci-checks.yml
  
  docker-image:
    runs-on: ubuntu-latest
    needs: ci-checks

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build . --tag laravel-app

